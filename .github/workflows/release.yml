name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            # AVX2 CPUs (Intel 2013+, AMD 2015+); .cargo/config.toml would use the build machine's CPU.
            # Static C runtime so the exe doesn't need the VC++ redistributable.
            rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static"
            features: ""
          - os: windows-2022
            name: windows-x64-cuda
            # nvcc builds candle's kernels with the static C runtime too
            rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static"
            features: "--features cuda"
            cuda: "12.8.1"
          - os: ubuntu-22.04
            name: linux-x64
            rustflags: "-C target-cpu=x86-64-v3"
            features: ""
          - os: macos-14
            name: macos-arm64
            rustflags: "-C target-cpu=apple-m1"
            features: "--features metal"
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CUDA
        if: matrix.cuda
        shell: pwsh
        run: |
          $v = "${{ matrix.cuda }}"
          $mm = $v.Substring(0, $v.LastIndexOf("."))
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/$v/network_installers/cuda_${v}_windows_network.exe" -OutFile cuda-setup.exe
          $pkgs = "nvcc cudart thrust cublas cublas_dev curand curand_dev nvrtc nvrtc_dev".Split(" ") | ForEach-Object { "$($_)_$mm" }
          Start-Process -Wait -FilePath .\cuda-setup.exe -ArgumentList (@("-s") + $pkgs)
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$mm"
          & "$root\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "CUDA_PATH=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          # PTX for 8.0 runs on RTX 30 series and newer; bf16 kernels need 8.0
          "CUDA_COMPUTE_CAP=80" >> $env:GITHUB_ENV
          # nvcc needs cl.exe and the MSVC include/lib paths
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match "^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$") { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
      - name: Build
        run: cargo build --release --locked ${{ matrix.features }}
      - name: Test
        # the CUDA build needs nvcuda.dll from the NVIDIA driver, which the runner doesn't have
        if: ${{ !matrix.cuda }}
        run: cargo test --release --locked ${{ matrix.features }}
      - name: Package
        shell: bash
        run: |
          dir="llm-finetune-$VERSION-${{ matrix.name }}"
          mkdir -p "$dir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/llm-finetune.exe "$dir/"
            if [ -n "${{ matrix.cuda }}" ]; then
              cuda="$(cygpath -u "$CUDA_PATH")/bin"
              for p in cudart64 cublas64 cublasLt64 curand64; do
                cp "$cuda"/${p}_*.dll "$dir/"
              done
            fi
            # everything has to load on a clean Windows: no VC++ runtime, and the only dll
            # that is neither in the folder nor in System32 is nvcuda.dll from the NVIDIA driver
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            dumpbin="$(cygpath -u "$("$vswhere" -latest -products '*' -find 'VC\Tools\MSVC\**\Hostx64\x64\dumpbin.exe' | head -n 1 | tr -d '\r')")"
            for f in "$dir"/*.exe "$dir"/*.dll; do
              if [ -e "$f" ]; then
                "$dumpbin" -nologo -dependents "$f" | tr -d '\r' | grep -io '[a-z0-9_.-]*\.dll$'
              fi
            done | tr 'A-Z' 'a-z' | sort -u | while read -r d; do
              echo "imports $d"
              case "$d" in
                vcruntime*|msvcp*) echo "needs the VC++ runtime"; exit 1 ;;
                nvcuda.dll|api-ms-win-*|ext-ms-*) ;;
                *) if [ ! -e "$dir/$d" ] && [ ! -e "/c/Windows/System32/$d" ]; then echo "missing $d"; exit 1; fi ;;
              esac
            done
            ls -l "$dir"
          else
            cp target/release/llm-finetune "$dir/"
          fi
          cp README.md LICENSE "$dir/"
          cp -r examples/data "$dir/example-data"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/$dir.zip" "$dir" > /dev/null
          else
            tar czf "dist/$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/*
          body: |
            Download the file for your system, unzip it and run `llm-finetune` (`llm-finetune.exe` on Windows).
            The browser opens at http://127.0.0.1:7860. Models and outputs are kept in a `workspace` folder next to where you start it.

            - **Windows with an NVIDIA GPU**: `windows-x64-cuda`. Needs an RTX 30 series card or newer (compute capability 8.0+) and NVIDIA driver 570 or newer. The CUDA libraries are in the zip, the CUDA toolkit is not needed.
            - **Windows without NVIDIA**: `windows-x64`, runs on the CPU.
            - **macOS** (Apple Silicon, uses the GPU through Metal): the first time, right-click the file and choose Open, or run `xattr -d com.apple.quarantine llm-finetune`.
            - **Linux**: `linux-x64`, runs on the CPU. `chmod +x llm-finetune` if needed.

            If SmartScreen says "Windows protected your PC", click "More info" then "Run anyway".
            The CPU builds need a CPU with AVX2. For NVIDIA on Linux, or older NVIDIA cards, build from source with `cargo build --release --features cuda`.
